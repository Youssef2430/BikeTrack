name: BikeTrack
options:
  bundleIdPrefix: com.biketrack
  deploymentTarget:
    watchOS: '11.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7C45645JW6
packages:
  RideCore:
    path: .
targets:
  BikeTrackStore:
    type: application.watchapp2-container
    platform: iOS
    deploymentTarget: '18.0'
    dependencies:
      - target: BikeTrack
        embed: true
        link: false
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.youssefchouay.biketrack
        PRODUCT_NAME: BikeTrackStore
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BikeTrack
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: '1,2'
        SKIP_INSTALL: NO
  BikeTrack:
    type: application
    platform: watchOS
    sources: [WatchApp]
    dependencies:
      - package: RideCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.youssefchouay.biketrack.watchapp
        TARGETED_DEVICE_FAMILY: '4'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SKIP_INSTALL: YES
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: BikeTrack
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKWatchOnly: true
        WKBackgroundModes: [workout-processing]
        NSBluetoothAlwaysUsageDescription: BikeTrack connects to your bike or treadmill to record speed, cadence, power, and distance.
        NSHealthShareUsageDescription: BikeTrack reads your heart rate and workout energy so you can see them during your session.
        NSHealthUpdateUsageDescription: BikeTrack saves your workouts, heart rate, energy, and equipment metrics to Apple Health and Fitness.
    entitlements:
      path: WatchApp/BikeTrack.entitlements
      properties:
        com.apple.developer.healthkit: true
  BikeTrackUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources: [UITests]
    dependencies:
      - target: BikeTrack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.biketrack.uitests
  BikeTrackTests:
    type: bundle.unit-test
    platform: watchOS
    sources: [WatchTests]
    dependencies:
      - target: BikeTrack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.biketrack.tests
schemes:
  BikeTrackStore:
    build:
      targets:
        BikeTrackStore: all
    archive:
      config: Release
  BikeTrack:
    build:
      targets:
        BikeTrack: all
    test:
      targets: [BikeTrackTests, BikeTrackUITests]
